[project]
name = "lufs-workchain"
version = "2.0.0"
description = "YAML-driven audio processing pipeline with modular components"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "soundfile>=0.12",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "glitch_this>=1.0",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "fastmcp>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
