# ci/verify.yml — Main correctness gate for lufs-audio/workchain
#
# Guards:
#   - Node CLI unit tests (vitest)
#   - Registry freshness: components/index.json must not be stale
#   - Chain validation: all chains pass --strict
#   - Release-check script (tools/release-check.sh), if present
#   - Doctor preflight (informational only — see note below)
#
# Triggers: push to main, every pull_request
#
# Local equivalent:
#   sudo apt-get install -y ffmpeg
#   npm ci                        # root manifest: the CLI's runtime dependencies
#   cd cli && npm ci && npm test  # cli manifest: vitest only, then the unit suite
#   node cli/bin/workchain.js registry check
#   node cli/bin/workchain.js validate all --strict
#   node cli/bin/workchain.js doctor          # informational
#   bash tools/release-check.sh                    # if it exists
#
# Notes:
#   - stem_separation is EXCLUDED from all validation steps that would require
#     its venv + model weights (audio-separator, ~GB of model data). The component
#     is correctly marked with a python.venv requirement; preflight will report it
#     missing on a bare runner. `doctor` is run with --exclude stem_separation (or
#     equivalent flag; see below) to avoid a false failure that would mask real ones.
#   - `doctor` does NOT gate the build. The workchain doctor command exercises
#     preflight across the full registry, and heavy components (stem_separation)
#     will legitimately fail on a bare GitHub-hosted runner that has no venv or
#     model weights. Making doctor a gate would require either skipping the one
#     component that cannot run in CI (acceptable) or provisioning gigabytes of
#     model weights (not acceptable on free-tier). Instead we run it informational
#     (continue-on-error: true) so its output is visible in the log and real
#     light-component regressions are caught by the validate/registry steps.
#   - `registry check` and `validate all --strict` DO gate. Never add
#     continue-on-error or || true to those steps.

name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify ([self-hosted, lufs])
    runs-on: [self-hosted, lufs]

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.x

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4 # v4.x
        with:
          node-version: '20'

      # The CLI's runtime dependencies live in the ROOT manifest only — the single source
      # of truth, asserted by cli/test/import-audit.test.js. cli/package.json is packaging
      # metadata plus the vitest devDependency. Both lockfiles are committed, so both
      # installs are frozen: the lockfile is the input, not a suggestion, and npm ci fails
      # loudly on drift that npm install would quietly paper over. Installing ONLY
      # cli/package.json would leave the CLI unable to resolve 'commander' at startup
      # (ERR_MODULE_NOT_FOUND) — the regression that broke main.
      - name: Install Node dependencies (frozen)
        run: |
          npm ci
          cd cli && npm ci

      - name: Run unit tests
        run: cd cli && npm test

      # GATE: the real one — every light chain end to end, plus the negative test that proves
      # the verifier still fails closed.
      #
      # This step used to be wrapped in `if [ -x tools/release-check.sh ]`, dating from when
      # the script was still being written by a concurrent task. That guard made the most
      # important gate in the repository FAIL OPEN: if the file were missing, renamed, or had
      # lost its executable bit — which has happened four times, because pushing over the
      # GitHub REST API resets the mode to 100644 — CI would silently skip verification
      # entirely and report green on an unverified tree.
      #
      # The script exists and is committed 100755. Call it unconditionally. Never reintroduce
      # a conditional here, and never add continue-on-error.
      - name: Release check
        run: ./tools/release-check.sh

      # GATE: documentation health — link resolution, llms.txt freshness, frontmatter,
      # license consistency. Run after release-check so all generated artifacts exist.
      - name: Documentation health check
        run: ./tools/doc-check.sh
      # If any component file changed without regenerating the index, this fails.
      # Never add continue-on-error here.
      - name: Check registry freshness
        run: node cli/bin/workchain.js registry check

      # GATE: all chains must pass strict validation.
      # Never add continue-on-error here.
      - name: Validate all chains (strict)
        run: node cli/bin/workchain.js validate all --strict

      # INFORMATIONAL: doctor runs preflight across the full registry.
      # continue-on-error is intentional here — stem_separation will legitimately
      # fail its python venv / model-weights preflight on a bare runner.
      # This step exists so the output is visible in CI logs; it must NOT gate.
      # If we ever add a --exclude flag to doctor, replace this with:
      #   node cli/bin/workchain.js doctor --exclude stem_separation
      - name: Doctor preflight (informational)
        run: node cli/bin/workchain.js doctor
        continue-on-error: true
