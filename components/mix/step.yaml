name: mix
description: "Two-input audio mix (ffmpeg amix) — the demo consumer of the in2: second-input channel (issue #10). Sums the step's primary input (the existing chain input) and a second input declared with in2: into one stereo 44.1 kHz WAV."
version: "1.0"

type: audio

# Two-input channel (issue #10): a component that consumes a second input MUST declare
# this, or validation refuses any chain that passes in2: to it (fail closed — the second
# input must never be silently dropped).
accepts_second_input: true

input_types:
  - wav
  - mp3
  - aiff
  - aif
  - flac
  - m4a
  - ogg
  - opus

output_type: audio

params_schema:
  duration_mode:
    type: string
    default: longest
    description: "amix duration policy: 'longest' (output spans the longer of the two inputs) or 'first' (output ends with the primary input). 'longest' is what turns a mismatched-duration second input into a verifier-caught failure — the mix stretches past the primary's timeline and audio_duration_matches re-measures the difference."
  normalize:
    type: boolean
    default: true
    description: "amix normalize: true scales each input before summing (protects against clipping), false keeps raw levels so the mix level reflects input amplitude."

outputs:
  schema_version: "1.0"
  description: "Mixed audio file plus a JSON sidecar recording the facts the component measured about BOTH inputs (duration, sha256, mean level)."
  items:
    - name: primary_output
      type: file
      description: "Mixed audio file (stereo, 44.1 kHz, 16-bit WAV)"
      required: true
      mime_type: "audio/wav"
      path_template: "{input_name}_mixed.wav"
    - name: mix_metadata
      type: json
      description: "Component-measured facts about both inputs — durations, sha256 digests, mean levels, resolved paths"
      required: true
      path_template: "logs/mix_metadata.json"

requirements:
  commands:
    - ffmpeg
    - ffprobe

verify:
  schema_version: "1.0"
  outputs:
    - name: primary_output
      assert: [exists, non_empty, audio_valid]
    - name: mix_metadata
      assert: [exists, non_empty, json_valid]
      json_has: [in_a, in_b]
  post_conditions:
    - id: mix_preserves_primary_duration
      check: audio_duration_matches
      outputs: [primary_output]
      tolerance_s: 0.2
      description: "INDEPENDENT re-measurement: the mix output must keep the PRIMARY input's timeline. With duration_mode=longest a second input longer than the primary stretches the mix past it, and this check fails — this is the two-input prove-it-can-fail path."
    - id: both_inputs_provenanced
      check: json_fields_within
      output: mix_metadata
      require:
        - "in_a.duration_s is number"
        - "in_a.mean_volume_db is number"
        - "in_a.sha256 is non_empty"
        - "in_b.duration_s is number"
        - "in_b.mean_volume_db is number"
        - "in_b.sha256 is non_empty"
        - "in_b.path is non_empty"
      description: "WEAKER — reads the mix_metadata sidecar the component wrote about itself. This is the two-input post-condition model: component-measured facts about the SECOND input, nameable because the run records in2 provenance (steps.<id>.inputs). It proves each input was MEASURABLE (duration and mean level are real numbers, digests non-empty) — it does NOT prove non-silence (digital silence measures ~-91 dBFS, a number) — and it is deliberately not the independent half of the contract. The independent re-measurement is the duration check above."